<div class="header-details_wrapper">
  <a href='/' class="header-details_log">
    <div class="logo">
      <p>LOGO</p>
    </div>
    <div class="title">
      <p class="title_company">Название компании</p>
      <p class="title_description">Художественная галерея</p>
    </div>
  </a>
  <div class="header-details_menu">
    <div class="menu-block">
      @for (menu of menuList; track menu.id) {
      <ul class="list">
        <a [href]="menu.path" class="contact-link">
          <li class="item">{{ menu.name | uppercase }}</li>
        </a>
      </ul>
      }
    </div>
    <div class="header-details_contact">
      <div class="contact-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
      </div>
      <div class="contact-info">
        <a href="tel:+79320009528" class="contact-item" aria-label="Позвонить">
          <p class="city">Санкт-Петербург, Россия</p>
          <p class="number">+7 (932) 000-95-28</p>
        </a>
      </div>
    </div>
  </div>
  <div class="menu">
    <app-menu></app-menu>
  </div>
</div>
